name: vox_ui
description: "The VOX phone app's Flutter screens (Canti)."

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
#
# This version is used _only_ for the Runner app, which is used if you just do
# a `flutter run`. It has no impact on any other native host app that you embed
# your Flutter project into.
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  # No third-party packages: Material 3 (in the SDK) is the component kit, and the rest is small code in
  # lib/src/theme. Why: README.md "Libraries".

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  uses-material-design: true

  # Brand art: pixel-exact PNGs made by ../brand/tools/stipple.py (`app`), one per whole-pixel scale (`name@n.png`,
  # n device px per dot); BrandArt (lib/src/theme/assets.dart) picks the one for the screen and draws it 1:1.
  assets:
    - assets/brand/
    # The Canti character sheet and manifest (made by ../brand/tools/canti_sprite.py): the one copy. The header plays
    # it, and the Android floating badge reads it from the APK's flutter_assets/ (test/sprite_test.dart checks it is here).
    - assets/badge/
    - assets/fonts/PressStart2P-OFL.txt
    - assets/fonts/Tiny5-OFL.txt

  # The dot-field background (lib/src/theme/dither_background.dart).
  shaders:
    - shaders/dither_field.frag

  # Pixel faces (SIL Open Font License 1.1, texts in assets/fonts): Press Start 2P (CodeMan38) for titles, labels
  # and headlines; Tiny5 (Stefie Justprince) for body text with lowercase. Both are drawn on an 8-unit em, so they
  # are only used at 8 x the pixel scale (lib/src/theme/pixel.dart). Bundled, never fetched at run time.
  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
    - family: Tiny5
      fonts:
        - asset: assets/fonts/Tiny5-Regular.ttf

  # This section identifies your Flutter project as a module meant for
  # embedding in a native host app.  These identifiers should _not_ ordinarily
  # be changed after generation - they are used to ensure that the tooling can
  # maintain consistency when adding or modifying assets and plugins.
  # They also do not have any bearing on your native host application's
  # identifiers, which may be completely independent or the same as these.
  module:
    androidX: true
    androidPackage: ai.vox.vox_ui
    iosBundleIdentifier: ai.vox.voxUi
