org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.caching=false
# The Flutter embedding (../ui, add-to-app) needs AndroidX. VOX's own code still uses framework APIs only.
android.useAndroidX=true
android.nonTransitiveRClass=true
# Keep the Kotlin compiler inside the Gradle process: no daemon files outside android/.state.
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
# Release builds: subset MaterialIcons to the glyphs the Flutter UI uses (flutter build apk does this by default; the
# Gradle plugin only when asked). Measured in ../ui/README.md "Performance".
tree-shake-icons=true
